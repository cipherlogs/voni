# Local rehearsal of the deployed topology (ticket 19).
#
#   docker compose -f deploy/docker-compose.yml up --build
#
# Same shape as the Northflank descriptor: one service instance, one
# single-read/write volume, a liveness health check the orchestrator waits on,
# and SIGTERM with a grace period equal to the recorded 30 s drain bound. This is
# how the "a deploy drains instead of cutting" claim is rehearsed offline; it is
# not the production host and it never holds real vendor keys.
#
# One instance is a correctness property, not a convenience: the token registry
# and the delivered-body channel are in-process, so a second replica would break
# single use and hold return. Do not add one.
#
# Secrets are not in this file. Copy deploy/voice-pipeline.env.example to
# deploy/voice-pipeline.env (gitignored), fill it locally, and compose passes the
# names through; a committed value fails `python deploy/topology.py`.
#
# The app is a separate deployment: this file only gives it a container and a
# hostname so a local browser can reach both, and it is not built from the
# service image.

services:
  voice-pipeline:
    build:
      context: ..
      dockerfile: voice-pipeline/Dockerfile
    environment:
      # Non-secret host settings, the same ones the descriptor names.
      VOICE_PIPELINE_PORT: "8766"
      VOICE_PIPELINE_STT_PROVIDER: "assemblyai"
      VOICE_PIPELINE_STT_MODE: "balanced"
      VOICE_PIPELINE_LLM_MODEL: "muse-spark-1.3"
      VOICE_PIPELINE_TTS_MODEL: "assemblyai-tts-1"
      # A writable artifact directory on the mounted volume. A call whose events
      # cannot be written still runs; the end message names the reason as
      # eventsError.
      VOICE_PIPELINE_EVENTS_DIR: "/var/lib/voni/events"
      # REQUIRED and host-supplied: the M03 measured effort. Spark has no
      # default, so the default rung refuses setup while this is empty. It is
      # deliberately not set here: Compose gives `environment` precedence over
      # `env_file`, so an empty value here would make it impossible for the
      # local names file to supply the measured one.
      # REQUIRED for tool calls: the app origin the tool route calls. This is
      # the composed app service, so the local rehearsal exercises the real hop
      # instead of silently dropping every tool call.
      VOICE_PIPELINE_TOOL_BASE_URL: "http://voni:3000"
    env_file:
      # Optional: a local names file with values, never committed.
      - path: ./voice-pipeline.env
        required: false
    expose:
      - "8766"
    volumes:
      # One single-read/write volume, the same mount as the descriptor.
      - voice-events:/var/lib/voni
    deploy:
      replicas: 1
    healthcheck:
      # Liveness only, the same path the platform probes: /healthz touches no
      # vendor. Readiness (/readyz) is deliberately not this probe.
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8766/healthz", timeout=2).status == 200 else 1)
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    stop_signal: SIGTERM
    # = deploy.drain_max_wait_ms (30 000 ms): a live call is never killed by a
    # deploy, and a wait shorter than the recorded bound would kill one.
    stop_grace_period: 30s

  voni:
    # The app's own image, built and pushed by its own pipeline. This rehearsal
    # does not build it; point the tag at a local build if one exists.
    image: voni-app:local
    environment:
      PORT: "3000"
      VOICE_PIPELINE_URL: "http://voice-pipeline:8766"
      VOICE_PIPELINE_TOOL_BASE_URL: "http://voni:3000"
    ports:
      - "3000:3000"
    depends_on:
      voice-pipeline:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          fetch("http://127.0.0.1:3000/").then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3

volumes:
  voice-events:
