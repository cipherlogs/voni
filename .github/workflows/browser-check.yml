name: Browser check

# Real Chrome clicking the shared /email target list, dispatched by the panel's
# GitHub source (src/lib/github/dispatch.ts, `dispatchBrowserCheck`).
#
# Dispatch-only on purpose: GitHub's own scheduler cannot hold a sub-minute
# rhythm, so the app's ticker decides when a segment starts. One segment is at
# most 20000 seconds / ~5.6 h (MAX_JOB_SECONDS in src/lib/email/sources.ts);
# a 12 h or 24 h window is realised as chained segments of that length, and nothing in the
# workflow knows or cares which segment it is.
#
# The inputs are read by voni/scripts/browser-click.mjs and are asserted
# against the dispatcher by voni/scripts/browser-source-wiring.test.ts. Rename
# one here and that test fails before the run does.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Runner OS: ubuntu, windows or macos."
        required: true
        type: string
      targets:
        description: 'JSON array of URLs to click, e.g. ["https://voni.cc/test"].'
        required: true
        type: string
      interval:
        description: "Seconds between passes (15-3600)."
        required: true
        type: string
      window:
        description: "How long this segment runs, in seconds (at most 20000, i.e. ~5.6 hours)."
        required: true
        type: string
      selection:
        description: 'Rotation mode set on /email, shared with Grafana: "random" or "rotate".'
        required: true
        type: string

# The OS is part of the workflow's name on purpose: the card reads the run list
# for this workflow and needs to tell an ubuntu run from a macos one.
run-name: "Browser check (${{ inputs.os }})"

# One segment per OS at a time. Queued rather than cancelled: a second window
# must not overlap the first one's clicks, because two browsers on the same
# target at the same moment measure each other's noise.
concurrency:
  group: browser-check-${{ inputs.os }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ${{ inputs.os }}-latest
    # 20000 s of clicking plus install and teardown fits well inside this, and
    # it stays minutes under GitHub's six-hour hard ceiling: a runner that runs
    # away is cancelled deliberately, not by the platform's limit.
    timeout-minutes: 350
    defaults:
      run:
        working-directory: voni
        shell: bash
    env:
      # The dispatched inputs, under the names the runner reads.
      BROWSER_CHECK_OS: ${{ inputs.os }}
      BROWSER_CHECK_TARGETS: ${{ inputs.targets }}
      BROWSER_CHECK_INTERVAL: ${{ inputs.interval }}
      BROWSER_CHECK_WINDOW: ${{ inputs.window }}
      # The rotation mode is chosen once on /email and shared with Grafana; the
      # runner reads it, it never decides it.
      BROWSER_CHECK_SELECTION: ${{ inputs.selection }}
      # Low-privilege by design (the intake may append one click row and
      # nothing else), and never printed: the runner sends it as a header only.
      EMAIL_CLICK_REPORT_SECRET: ${{ secrets.EMAIL_CLICK_REPORT_SECRET }}
      # Optional egress proxy. GitHub-hosted runners leave from a small shared
      # Azure pool, so a non-datacenter address needs a proxy; empty values mean
      # no proxy, which is the runner's own address. Credentials are never
      # printed — the runner hands them to Playwright only.
      BROWSER_PROXY_SERVER: ${{ secrets.BROWSER_PROXY_SERVER }}
      BROWSER_PROXY_USERNAME: ${{ secrets.BROWSER_PROXY_USERNAME }}
      BROWSER_PROXY_PASSWORD: ${{ secrets.BROWSER_PROXY_PASSWORD }}
      # Phase 0 of the exit pool ships behind a repository variable, default
      # off. An unset variable is an empty string, which the runner reads as
      # "no pool", so a mis-merge cannot start spending account changes or send
      # a Click through a client nobody enabled. Only the exact value "true"
      # turns it on, and it is deliberately not a dispatch input.
      TUXLER_ENABLED: ${{ vars.TUXLER_ENABLED }}
      # The client's loopback control API. Mapped even when the pool is off so
      # the pooled steps have one address; the runner ignores it unless the
      # flag above is exactly "true".
      TUXLER_CONTROL_URL: http://127.0.0.1:41000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: voni/package-lock.json

      - run: npm ci

      # Real Chrome, not a bundled Chromium: a click that survives in a build
      # no visitor runs would prove the wrong thing about this target.
      - name: Install Chrome
        run: npx playwright install --with-deps chrome

      # The client starts before any Click and logs in from two repository
      # secrets, scoped to this step so the click step never sees them. It is
      # backgrounded with its output in a file: a step that held the client's
      # stdout open would never end, and the file is not uploaded because a
      # relay error is the one place an account could reach an artifact.
      - name: Start the exit pool
        if: env.TUXLER_ENABLED == 'true'
        env:
          TUXLER_USERNAME: ${{ secrets.TUXLER_USERNAME }}
          TUXLER_PASSWD: ${{ secrets.TUXLER_PASSWD }}
          TUXLER_HEALTH_PORT: "41000"
        run: |
          nohup node --import tsx scripts/tuxler-proxy.mts \
            > tuxler-client.log 2>&1 < /dev/null &
          echo $! > tuxler-client.pid

      # The refusal, before Chrome exists: three ready US exits or this step
      # fails. A failed step skips the click step below by default, so a pool
      # that is broken or short of exits writes no click row at all, and the
      # pool report artifact says why. Bounded at three minutes.
      - name: Wait for the exit pool
        if: env.TUXLER_ENABLED == 'true'
        run: node --import tsx scripts/browser-pool-gate.mjs

      - name: Click every target
        run: node --import tsx scripts/browser-click.mjs

      # After the clicks: one read of the pool, merged into the same report, so
      # a five-hour segment records the refills and exits it ended with. It
      # never fails the run — the click step already decided that.
      - name: Final pool report
        if: always() && env.TUXLER_ENABLED == 'true'
        run: node --import tsx scripts/browser-pool-gate.mjs --final

      - name: Stop the exit pool
        if: always() && env.TUXLER_ENABLED == 'true'
        run: |
          if [ -f tuxler-client.pid ]; then
            kill "$(cat tuxler-client.pid)" 2>/dev/null || true
          fi

      # Exits, cities, ASNs, refill counts and the failure when there was one.
      # A run with the flag off writes no report and uploads nothing; a run
      # whose gate failed uploads the reason.
      - name: Pool report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-pool-report-${{ inputs.os }}
          path: voni/pool-report.json
          if-no-files-found: ignore
          retention-days: 7

      # A failed click is evidence, so the image is kept even when the job is
      # red. A green run writes nothing here and that is normal.
      - name: Failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check-screenshots-${{ inputs.os }}
          path: voni/screenshots/
          if-no-files-found: ignore
          retention-days: 7
