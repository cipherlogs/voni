# The email-pool Worker pool deploys separately from voni (see deploy.yml).
# POOL_SECRET is set once on the Workers with `wrangler secret put` and persists
# across deploys — it must never appear in this workflow or its repository.
name: Deploy email-pool

on:
  push:
    branches: [main]
    paths:
      - "workers/email-pool/**"
      - "voni/src/lib/email/targets.json"
      - ".github/workflows/deploy-pool.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/email-pool
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/email-pool/package-lock.json
      - run: npm ci
      # Fast gate: the pool's unit tests must pass before anything ships.
      - run: npm test
      - run: EMAIL_POOL_SIZE=3 npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
