name: Nightly live smoke

# Spec (`.scratch/meta-cascade/spec.md`, "Fixtures, chaos and live smoke"):
# live smoke is key-gated and never in PR CI; nightly, one call per leg, which
# re-records the fixtures and alerts on wire drift without committing them. It
# does not write the production breaker or counter.
#
# This workflow is deliberately NOT referenced by ci.yml and has no
# pull_request trigger: a vendor outage is a nightly alert, never a red PR.
# Without keys the live job is skipped and labelled; it can never be read as a
# live pass.
on:
  schedule:
    # 03:17 UTC: after the vendors' nightly maintenance windows, before the
    # European morning. Any minute works; the run is not time-sensitive.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The key gate. `secrets` are not available to a job-level `if:`, so the
  # first job turns key presence into an output the live job can condition on.
  keys:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The same environment the live job uses: secrets scoped to `nightly` are
    # not visible to a job that names no environment, which would make the
    # gate always false and the night silently skipped.
    environment: nightly
    outputs:
      present: ${{ steps.keys.outputs.present }}
    steps:
      - name: Live keys present?
        id: keys
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
        run: |
          if [ -n "$META_API_KEY" ] && [ -n "$ASSEMBLYAI_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "live vendor keys present"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Live smoke: SKIPPED — no vendor keys"
              echo ""
              echo "No live call was made and this run is not a live pass."
              echo "Add META_API_KEY and ASSEMBLYAI_API_KEY to the \`nightly\`"
              echo "environment to turn it on."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=live smoke skipped::No vendor keys; no live claim was made."
          fi

  # One call per vendor leg (speech, model stream, voice), then a wire-drift
  # comparison against the committed fixtures. The recording goes to
  # $RUNNER_TEMP: it is evidence for a human, never a commit.
  live-smoke:
    needs: [keys]
    if: needs.keys.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Bridge venv
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv/bin/python -r requirements-ci.txt
      # The speech leg replays a tracked synthesized caller line; decoding it
      # to 24 kHz PCM is the only external tool the night needs.
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      # The existing timing lock serializes live runs: same file as the demo
      # scoreboard (voni/src/lib/demo/timing-lock.ts), so a live score-demo run
      # and this night cannot overlap. A held lock fails the night by name.
      - name: Live smoke (one call per leg, drift alert)
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          # M03 owns reasoning_effort. Unset, the model leg is BLOCKED by name
          # and the night is not reported green — never an invented effort.
          META_REASONING_EFFORT: ${{ vars.META_REASONING_EFFORT }}
        run: |
          # No lock-path override: the night takes the existing shared lock
          # (/tmp/voni-demo-timing.lock), the same file the demo scoreboard
          # takes, so live runs serialize across tools.
          .venv/bin/python voice-pipeline/nightly_smoke.py \
            --out "$RUNNER_TEMP/nightly-recordings"
      - name: Recording (evidence, never committed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-live-recording
          path: ${{ runner.temp }}/nightly-recordings/
          if-no-files-found: ignore
          retention-days: 7

  # The visible result of the night. Keys present but the live job failed is a
  # red alert; keys absent is an explicit skip, never a green live claim.
  live-smoke-status:
    needs: [keys, live-smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report the night's state
        run: |
          echo "keys=${{ needs.keys.outputs.present }} live-smoke=${{ needs.live-smoke.result }}"
          if [ "${{ needs.keys.outputs.present }}" = "true" ]; then
            test "${{ needs.live-smoke.result }}" = "success"
            echo "### Live smoke: PASSED (live vendor run)" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Live smoke: SKIPPED — no keys"
              echo ""
              echo "No live call was made. Branch protection does not require"
              echo "this workflow, so a skip never blocks a PR."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=live smoke skipped::No vendor keys; no live claim was made."
          fi

  # ---------------------------------------------------------------------------
  # Ticket 30: demo nightly health. English 43 x 1 plus the Locale core 12 x 1
  # on each of es, fr, de and pt = 91 calls. The gate reads
  # dvCostNightlyRunMaxUsd ($15) before the first call; at the frozen $0.15
  # per-call cap the plan is $13.65. A clean report is "health-clean" and
  # still exits 1 (it is not a certificate), so demo-gate-report.mjs is the
  # gate. Missing keys are a named skip and the required wrapper fails: this
  # night is never green without evidence.
  # ---------------------------------------------------------------------------
  demo-keys:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: nightly
    outputs:
      present: ${{ steps.keys.outputs.present }}
    steps:
      - name: Demo keys present?
        id: keys
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          VOICE_PIPELINE_ENVELOPE_SECRET: ${{ secrets.VOICE_PIPELINE_ENVELOPE_SECRET }}
        run: |
          if [ -n "$META_API_KEY" ] && [ -n "$ASSEMBLYAI_API_KEY" ] && [ -n "$VOICE_PIPELINE_ENVELOPE_SECRET" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Demo nightly health: SKIPPED — no demo keys"
              echo ""
              echo "No call was made and this night makes no health claim."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=demo nightly skipped::No demo keys; the required wrapper will fail."
          fi

  demo-nightly-health:
    needs: [demo-keys]
    if: needs.demo-keys.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: nightly
    defaults:
      run:
        working-directory: voni
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: voni/package-lock.json
      - run: npm ci
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Nightly health (English 43 x 1 + Locale core 12 x 1 x 4)
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          VOICE_PIPELINE_ENVELOPE_SECRET: ${{ secrets.VOICE_PIPELINE_ENVELOPE_SECRET }}
          VOICE_PIPELINE_URL: ${{ vars.VOICE_PIPELINE_URL }}
        run: |
          set +e
          npm run --silent demo:verify -- --nightly --target local --json > "$RUNNER_TEMP/demo-nightly.json" 2> "$RUNNER_TEMP/demo-nightly.err"
          set -e
          cat "$RUNNER_TEMP/demo-nightly.json" || true
          cat "$RUNNER_TEMP/demo-nightly.err" >&2 || true
          node --import tsx scripts/demo-gate-report.mjs nightly "$RUNNER_TEMP/demo-nightly.json"
      - name: Nightly run artifacts (never committed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-nightly-run
          path: voni/.demo-runs/
          if-no-files-found: error
          retention-days: 7

  # The named skip is a visible failure, never a green night. Branch protection
  # requires this gate, not the job.
  required-demo-nightly-health:
    needs: [demo-keys, demo-nightly-health]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: no keys is a named failure, never a health claim
        if: needs.demo-keys.outputs.present != 'true'
        run: |
          echo "SKIPPED: demo nightly health made no call — META_API_KEY, ASSEMBLYAI_API_KEY and VOICE_PIPELINE_ENVELOPE_SECRET are not all set"
          exit 1
      - name: the health job must have succeeded
        if: needs.demo-keys.outputs.present == 'true'
        run: |
          echo "demo-nightly-health result: ${{ needs.demo-nightly-health.result }}"
          test "${{ needs.demo-nightly-health.result }}" = "success"
      - name: the run artifact must exist
        if: needs.demo-keys.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          name: demo-nightly-run
          path: demo-nightly-run
      - name: artifact must not be empty
        if: needs.demo-keys.outputs.present == 'true'
        run: test -d demo-nightly-run
