name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voni
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: voni/package-lock.json
      - run: npm ci
      # PageProps/LayoutProps/RouteContext live in .next/types, which is
      # gitignored — generate them before tsc on a fresh checkout.
      - name: Generate Next.js route types
        run: npx next typegen
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Manifest is current
        run: npm run copilot:manifest:check
