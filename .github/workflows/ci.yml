name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: voni
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: voni/package-lock.json
      - run: npm ci
      # typecheck runs next typegen first: PageProps/LayoutProps/RouteContext
      # live in .next/types, which is gitignored on a fresh checkout.
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      # The audition-clip regeneration test encodes a committed take with
      # ffmpeg and fails (not skips) in CI when the tool is absent.
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      # npm test runs the manifest check and every auto-discovered unit test.
      - name: Tests
        run: npm test
      # Tickets 145/147/148: the anti-lie and rollback proofs are committed
      # tests, not intentions. Naming the reply-gap proof here means a deleted
      # or renamed module fails by name; `npm test` already discovers it.
      - name: Anti-lie reply gap
        run: node --import tsx --test src/lib/demo/anti-lie-reply-gap.test.ts
      # Ticket 143: a fallback-contaminated run (any leg, any phase, connect
      # included), a budget stop, a missing capture and a harness break cannot
      # be green. The proof is a committed test, so deleting the eligibility
      # branch or the flag/stream refusal fails this step by name.
      - name: Anti-lie contaminated run
        run: node --import tsx --test src/lib/demo/anti-lie-contaminated-run.test.ts

  # Seam 4 (ticket 149): a real Chromium runs the real browser client, the real
  # mic path and the real playout worklet against a deterministic fake
  # WebSocket service, and writes a real delivered capture on every PR. No
  # vendor key and no vendor host is reachable from the spec (the fake is
  # Playwright's WebSocket routing; a vendor request fails the run by name).
  #
  # The runtime claim comes from `ci.browser_e2e_budget_s` in
  # voice-pipeline/cascade/thresholds.json, read by scripts/e2e-run.mjs. The
  # `timeout-minutes` below is only a hang guard, matching the python job: it is
  # not the E2E budget, and it never substitutes for the registry entry.
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: voni
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: voni/package-lock.json
      - run: npm ci
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser cascade E2E (delivered capture, fake socket)
        run: node scripts/e2e-run.mjs cascade
      # The capture is the point of the seam, so it outlives the throwaway
      # candidate. Uploading it on red too keeps a failing run's evidence; a
      # green run without the file fails rather than looking complete.
      - name: Delivered capture artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-delivery-capture
          path: voni/test-results/cascade-e2e/
          if-no-files-found: error
          retention-days: 7

  # A skipped or cancelled browser job must not report success. Require this
  # gate (`required-browser-e2e`), not the job, in branch protection.
  required-browser-e2e:
    runs-on: ubuntu-latest
    needs: [browser-e2e]
    if: always()
    timeout-minutes: 2
    steps:
      - name: browser-e2e job must have succeeded
        run: |
          echo "browser-e2e result: ${{ needs.browser-e2e.result }}"
          test "${{ needs.browser-e2e.result }}" = "success"

  # Ticket 30: the fast contract is the merge gate on every change to the call
  # path. It runs unconditionally (no paths filter): running it on every PR is
  # the superset of "every call-path change". A clean scoped-pass exits 1 by
  # contract, so scripts/demo-gate-report.mjs is what turns it into a gate.
  #
  # Policy (owner decision, 2026-11-03): CI holds no vendor keys, so the fast
  # contract makes no call here. `demo-fast-keys` turns key presence into an
  # output (a secret is not available to a job-level `if:`); without the keys
  # the run job is SKIPPED BY NAME and `required-demo-fast-contract` passes with
  # that skip printed in the log and the step summary. A skip is never a
  # contract claim: the real gate is the post-deploy cutover run
  # (`npm run check:real-legs`), which must not skip for a cutover claim.
  # The keys must be repository secrets (or this job must name the environment
  # that holds them); no `environment:` is declared on this PR workflow.
  demo-fast-keys:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.keys.outputs.present }}
      missing: ${{ steps.keys.outputs.missing }}
    steps:
      - name: Vendor keys present?
        id: keys
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          VOICE_PIPELINE_ENVELOPE_SECRET: ${{ secrets.VOICE_PIPELINE_ENVELOPE_SECRET }}
        run: |
          missing=""
          if [ -z "$META_API_KEY" ]; then missing="META_API_KEY"; fi
          if [ -z "$ASSEMBLYAI_API_KEY" ]; then
            if [ -n "$missing" ]; then missing="$missing, "; fi
            missing="${missing}ASSEMBLYAI_API_KEY"
          fi
          if [ -z "$VOICE_PIPELINE_ENVELOPE_SECRET" ]; then
            if [ -n "$missing" ]; then missing="$missing, "; fi
            missing="${missing}VOICE_PIPELINE_ENVELOPE_SECRET"
          fi
          if [ -n "$missing" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "missing=$missing" >> "$GITHUB_OUTPUT"
            echo "SKIPPED: the demo fast contract made no call — missing vendor keys: $missing."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "missing=" >> "$GITHUB_OUTPUT"
            echo "vendor keys present: the demo fast contract will run."
          fi

  # Keys alone are not sufficient for a real run: VONI_APP_URL and
  # VOICE_PIPELINE_URL must also point at a loopback app (with the dev capture
  # sink) and pipeline, both reachable from the runner. This job does not start
  # that stack; a keyed run without it refuses by name (app-url/pipeline-url).
  demo-fast-contract:
    needs: [demo-fast-keys]
    if: needs.demo-fast-keys.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: voni
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: voni/package-lock.json
      - run: npm ci
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Fast contract (ten scenarios, one repetition)
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          VOICE_PIPELINE_ENVELOPE_SECRET: ${{ secrets.VOICE_PIPELINE_ENVELOPE_SECRET }}
          VOICE_PIPELINE_URL: ${{ vars.VOICE_PIPELINE_URL }}
        run: |
          set +e
          npm run --silent demo:verify -- --fast --target local --json > "$RUNNER_TEMP/demo-fast.json" 2> "$RUNNER_TEMP/demo-fast.err"
          set -e
          cat "$RUNNER_TEMP/demo-fast.json" || true
          cat "$RUNNER_TEMP/demo-fast.err" >&2 || true
          node --import tsx scripts/demo-gate-report.mjs fast "$RUNNER_TEMP/demo-fast.json"
      # Audio, traces and delivered WAVs are working files, never commits.
      - name: Run artifacts (never committed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-fast-run
          path: voni/.demo-runs/
          if-no-files-found: error
          retention-days: 7

  # The required check. It passes on the named key skip (policy A) and still
  # fails when the keys were present but the run failed, was cancelled, or left
  # no run artifact. The skip is printed and annotated, so it never reads as a
  # clean contract. Require this gate in branch protection, not the job.
  required-demo-fast-contract:
    runs-on: ubuntu-latest
    needs: [demo-fast-keys, demo-fast-contract]
    if: always()
    timeout-minutes: 5
    steps:
      # A failed, cancelled or skipped key gate is red. Only a gate that ran and
      # reported the keys absent may take the named-skip branch below.
      - name: the key gate must have run
        if: needs.demo-fast-keys.result != 'success'
        run: |
          echo "demo-fast-keys result: ${{ needs.demo-fast-keys.result }}"
          exit 1
      - name: no vendor keys is a named skip, never a contract claim
        if: needs.demo-fast-keys.result == 'success' && needs.demo-fast-keys.outputs.present != 'true'
        run: |
          line="SKIPPED: the demo fast contract made no call — missing vendor keys: ${{ needs.demo-fast-keys.outputs.missing }}. No call was made, so the demo contract is unproven in CI. The real gate is the post-deploy cutover run, which must not skip for a cutover claim."
          echo "$line"
          {
            echo "### Demo fast contract: SKIPPED — no vendor keys"
            echo ""
            echo "$line"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=demo fast contract skipped::No vendor keys; no call was made and the contract is unproven in CI."
      - name: keys present — the fast job must have succeeded
        if: needs.demo-fast-keys.outputs.present == 'true'
        run: |
          echo "demo-fast-contract result: ${{ needs.demo-fast-contract.result }}"
          test "${{ needs.demo-fast-contract.result }}" = "success"
      - name: keys present — the run artifact must exist
        if: needs.demo-fast-keys.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          name: demo-fast-run
          path: demo-fast-run
      - name: keys present — artifact must not be empty
        if: needs.demo-fast-keys.outputs.present == 'true'
        run: test -d demo-fast-run

  # The Python suites: telephony-bot/ plus voice-pipeline/, which includes the
  # three recorded provider fixture suites and their manifest. No vendor key
  # and no network beyond the package install. Deliberately no `paths:` filter
  # and no job-level `if:`: this job must run on every PR.
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # a hang must fail, not sit for the 6 h default
    env:
      # telephony-bot/server.py reads os.environ["PUBLIC_HOST"] at import time.
      # Any value works; nothing dials it from a test.
      PUBLIC_HOST: ci.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Bridge venv
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv/bin/python -r requirements-ci.txt
      # orchestrator.py's `_default_scorer` wraps the voice_judge import in
      # `except Exception: return 0.0`: a missing aiohttp degrades every
      # barge-in score to 0.0 instead of naming the dependency. Assert the
      # judge parity import explicitly, here, where it fails by name.
      - name: Judge import
        run: |
          .venv/bin/python - <<'PY'
          import sys

          sys.path.insert(0, "telephony-bot")
          import aiohttp  # voice_judge imports it at module level
          import voice_judge

          assert voice_judge.heuristic_barge_in_score("stop", 3000) == 0.9
          PY
      # One wrapper for both suites. It also fails on an unexpected skip:
      # `unittest` exits 0 with "OK (skipped=N)", so a disabled test would
      # otherwise look green. A skip is an unfinished test, not a pass.
      - name: Python suites (no unexpected skips)
        run: PYTHON=.venv/bin/python bash scripts/python-tests.sh
      # No ticket-graph step: specs and tickets are deleted once done
      # (c375e909), and `.scratch/` is untracked so a local note cannot move
      # the code fingerprint, so a committed graph never exists to validate.
      # The tool stays covered by voice-pipeline/test_ticket_tool.py.
      # Ticket 135/141: the topology and secret validators exist but were only
      # run by hand. A validator that is not in CI is a runbook, not a guardrail.
      - name: Deployment topology and secret scan
        run: |
          .venv/bin/python deploy/topology.py
          .venv/bin/python deploy/secret_scan.py
      # Ticket 142: one suite per provider over recorded frames (STT 34, model
      # stream 45, voice 56), all offline and key-free. They are already inside
      # the discovery above, but naming them here makes a broken recording fail
      # in a step that says which provider. The manifest re-runs each suite
      # with a recorder, so a fixture on disk that no test replays fails by
      # name; it also refuses to let this workflow drop a suite, add a path
      # filter, continue on error, or take a vendor key.
      - name: Provider fixture suites (STT, LLM, TTS)
        working-directory: voice-pipeline
        run: |
          ../.venv/bin/python -m unittest \
            cascade.test_meta_stt_fixtures \
            cascade.test_meta_llm_fixtures \
            cascade.test_tts_fixtures \
            test_fixture_manifest
      # Ticket 148: the rollback test runs in CI. It flips the durable routing
      # switch while a call is live and proves new calls open zero cascade
      # sockets; naming it here means a deleted module fails by name rather
      # than silently vanishing from discovery.
      - name: Anti-lie and rollback
        working-directory: voice-pipeline
        run: |
          ../.venv/bin/python -m unittest \
            cascade.test_admission \
            cascade.test_rollback
      # Ticket 146: every fallback is emitted, including at connect, and a run
      # whose frozen rung says fallback without the event is refused by name.
      # The proof is a committed test: deleting the emission fails this step.
      - name: Anti-lie fallback emission
        working-directory: voice-pipeline
        run: ../.venv/bin/python -m unittest cascade.test_anti_lie_fallback_emission

  # AC4: a skipped or cancelled Python job must not report success. A job that
  # never runs produces no failing check, so branch protection must require
  # `required-python` (this job), not `python`. `if: always()` makes an
  # explicit failure out of skipped, cancelled and failed alike.
  required-python:
    runs-on: ubuntu-latest
    needs: [python]
    if: always()
    timeout-minutes: 2
    steps:
      - name: python job must have succeeded
        run: |
          echo "python result: ${{ needs.python.result }}"
          test "${{ needs.python.result }}" = "success"
