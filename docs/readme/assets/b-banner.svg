<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-label="Voni: voice agents that finish the job">
  <title>Voni</title>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#0a0a0a" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="gridMajor" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M160 0 H0 V160" fill="none" stroke="#0a0a0a" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Light banner: transparent background, dark ink. Served when the reader's
       colour preference is light, so the page behind it is light. -->
  <path d="M0 0 H1280 V460 H0 Z" fill="url(#grid)"/>
  <path d="M0 0 H1280 V460 H0 Z" fill="url(#gridMajor)"/>

  <g stroke="#0a0a0a" stroke-opacity="0.3" stroke-width="1">
    <path d="M40 40 h12 M46 34 v12"/>
    <path d="M1240 40 h-12 M1234 34 v12"/>
    <path d="M40 420 h12 M46 414 v12"/>
    <path d="M1240 420 h-12 M1234 414 v12"/>
  </g>

  <!-- left column -->
  <g transform="translate(96,104) scale(5.2)">
    <path d="M5 9Q12 24 19 9" transform="translate(0,4)" fill="none" stroke="#016630" stroke-width="2.75" stroke-linecap="round"/>
    <text x="26" y="22" font-family="Geist, Inter, system-ui, -apple-system, sans-serif" font-size="19" font-weight="600" letter-spacing="-0.5" fill="#0a0a0a">oni</text>
  </g>

  <text x="98" y="266" font-family="Geist, Inter, system-ui, -apple-system, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.7" fill="#0a0a0a">Voice agents that finish the job.</text>
  <text x="98" y="302" font-family="Geist, Inter, system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="#0a0a0a">Design the workflow. The call runs it. The work is done before it hangs up.</text>

  <g font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.2" fill="#0a0a0a">
    <text x="98" y="352">PHONE · VIDEO · VOICE NOTE · TEXT</text>
  </g>

  <!-- right: the V curve as a measured drawing -->
  <g transform="translate(872,96)">
    <g stroke="#0a0a0a" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 3">
      <line x1="-14" y1="70" x2="256" y2="70"/>
      <line x1="121" y1="-14" x2="121" y2="292"/>
    </g>
    <path d="M5 9Q12 24 19 9" transform="translate(-13,0) scale(11.2)" fill="none" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="121" cy="70" r="3" fill="none" stroke="#0a0a0a" stroke-opacity="0.6" stroke-width="1"/>
    <g font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="0.6" fill="#0a0a0a">
      <text x="252" y="60" text-anchor="end">apex</text>
      <text x="127" y="294">resting phase</text>
    </g>
  </g>

  <line x1="96" y1="398" x2="1184" y2="398" stroke="#0a0a0a" stroke-opacity="0.14" stroke-width="1"/>
  <g font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.2" fill="#0a0a0a">
    <text x="96" y="422">FIG. 01 · THE SESSION</text>
    <text x="1184" y="422" text-anchor="end">VONI.CC</text>
  </g>
</svg>
